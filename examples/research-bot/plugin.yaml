id: research-bot
name: "Research Bot"
version: "0.1.0"
description: "Demonstrates the Stage 7 reasoning API — invokes AURORAZ's Fractal 1:3 engine at K1 (general questions) and K3 (verify + refine) on demand."
author: "ResinCore"
category: "ai"
icon: "🔬"
tags: [example, reasoning, ai, k3]

# Stage 7 — declaring k3 also implies k0/k1/k2 via the additive hierarchy.
# notifications:show is used by the on_startup hook to greet the user.
permissions:
  - reasoning:k3
  - notifications:show

sdk_entry: main.py
